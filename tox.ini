[tox]
envlist = py3{8,9,10,11,12}-{3.2,4.0,4.1,4.2},py3{10,11,12}-{3.2,4.0,4.1,4.2,5.0,5.1,5.2}

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312

[testenv]
commands = python runtests.py
deps =
    2.2: Django>=2.2,<3.0
    3.2: Django>=3.2,<4.0
    4.0: Django>=4.0,<4.1
    4.1: Django>=4.1,<4.2
    4.2: Django>=4.2,<4.3
    5.0: Django>=5.0,<5.1
    5.1: Django>=5.1,<5.2
    5.2: Django>=5.2,<5.3